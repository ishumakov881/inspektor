# Copied from coil
name: CI
on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  pull_request:
concurrency:
  # Limit concurrency to 1 for PRs. 'main' concurrency isn't limited.
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  CI: true
  JAVA_VERSION: 17
  ORG_GRADLE_IDE_DOWNLOADJAVADOC: false
  ORG_GRADLE_IDE_DOWNLOADSOURCES: false
jobs:
  checks:
    name: Checks
    runs-on: macos-latest
    timeout-minutes: 30
    if: false # https://github.com/Kotlin/binary-compatibility-validator/issues/261
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Check Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      #      - name: Check style
      #        run: ./gradlew spotlessCheck

      - name: Check lint
        run: ./gradlew lint

      - name: Check binary compatibility
        run: ./gradlew apiCheck || { exit_code=$?; printf "*** This PR changes Inspektor's public API. If this change is intentional, run './gradlew apiDump' and commit the new API files. ***"; exit $exit_code; }

  unit-tests:
    name: Unit tests
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true
          gradle-home-cache-cleanup: true

      - name: Remove unused Xcode versions
        if: false
        run: |
          echo "Currently installed Xcode versions:"
          find /Applications -name "Xcode*" -maxdepth 1 -mindepth 1
          echo "Removing all except the currently selected Xcode version..."
          ls -d /Applications/Xcode* | grep -v "$(xcode-select -p | sed 's:/Contents/Developer::')" | xargs -P 3 -I {} sudo rm -rf "{}"
          echo "Available Xcode versions after removal:"
          find /Applications -name "Xcode*" -maxdepth 1 -mindepth 1

      - name: Unit tests
        run: ./gradlew :inspektor:jvmTest

  instrumentation-tests:
    name: Instrumentation tests
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        api-level: [ 22, 26, 31 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true
          gradle-home-cache-cleanup: true

      # API 30+ emulators only have x86_64 system images.
      - name: Get AVD info
        uses: ./.github/actions/get-avd-info
        id: avd-info
        with:
          api-level: ${{ matrix.api-level }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ steps.avd-info.outputs.arch }}
          target: ${{ steps.avd-info.outputs.target }}
          script: mv .github/debug.keystore ~/.android; ./gradlew connectedDebugAndroidTest

  build-sample:
    name: Build sample
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          cache-overwrite-existing: true
          gradle-home-cache-cleanup: true

      - name: Build Compose and View sample
        run: ./gradlew sample:assembleDebug

      - name: Build iOS app
        run: xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

  deploy-snapshot:
    name: Deploy
    runs-on: macos-latest
    timeout-minutes: 60
    if: github.repository == 'ishumakov881/inspektor' && startsWith(github.ref, 'refs/tags/v')
#    needs: [ checks, unit-tests, instrumentation-tests, build-sample ]
    needs: [ unit-tests, build-sample ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4

      - name: Deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          signing_key="${SIGNING_IN_MEMORY_KEY:-${SIGNING_KEY}}"
          signing_password="${SIGNING_IN_MEMORY_KEY_PASSWORD:-${SIGNING_KEY_PASSWORD}}"
          if [[ -z "${signing_key}" || -z "${signing_password}" ]]; then
            echo "::error::Missing signing secrets (SIGNING_IN_MEMORY_KEY or SIGNING_KEY)."
            exit 1
          fi
          if [[ -z "${MAVEN_CENTRAL_USERNAME}" || -z "${MAVEN_CENTRAL_PASSWORD}" ]]; then
            echo "::error::Missing MAVEN_CENTRAL_USERNAME or MAVEN_CENTRAL_PASSWORD."
            exit 1
          fi
          if [[ "${signing_key}" != *"BEGIN PGP PRIVATE KEY BLOCK"* ]]; then
            signing_key="$(printf '%s' "${signing_key}" | base64 --decode)"
          fi
          signing_key_id="$(printf '%s' "${signing_key}" | gpg --show-keys --with-colons - 2>/dev/null | awk -F: '/^(sec|pub):/ { print substr($5, length($5) - 7); exit }')"
          if [[ -z "${signing_key_id}" ]]; then
            echo "::error::Could not derive signing key id from the provided PGP key."
            exit 1
          fi
          export ORG_GRADLE_PROJECT_mavenCentralUsername="${MAVEN_CENTRAL_USERNAME}"
          export ORG_GRADLE_PROJECT_mavenCentralPassword="${MAVEN_CENTRAL_PASSWORD}"
          export ORG_GRADLE_PROJECT_signingInMemoryKeyId="${signing_key_id}"
          export ORG_GRADLE_PROJECT_signingInMemoryKeyPassword="${signing_password}"
          export ORG_GRADLE_PROJECT_signingInMemoryKey="${signing_key}"
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache